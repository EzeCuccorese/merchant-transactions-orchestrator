server:
  port: 8081

spring:
  application:
    name: orchestration-api
  threads:
    virtual:
      enabled: true
  mvc:
    pathmatch:
      matching-strategy: path_pattern_parser

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: orchestration-api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    use-root-path: true

services:
  persistence:
    url: ${PERSISTENCE_SERVICE_URL:http://localhost:8080}
  numerator:
    url: ${NUMERATOR_SERVICE_URL:http://localhost:3000}
    retry:
      max-attempts: ${NUMERATOR_RETRY_MAX_ATTEMPTS:5}
      min-delay-ms: ${NUMERATOR_RETRY_MIN_DELAY_MS:10}
      max-delay-ms: ${NUMERATOR_RETRY_MAX_DELAY_MS:100}

http:
  client:
    connect-timeout-ms: 5000
    read-timeout-ms: 5000

resilience4j:
  circuitbreaker:
    instances:
      numeratorService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      persistenceService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
